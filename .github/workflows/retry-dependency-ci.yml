name: recover transient dependency checks
on:
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:
  # Trusted default-branch code only; no PR code/artifacts run with this token.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [smoke-test]
    types: [completed]
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: dependency-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: master
          persist-credentials: false
      - name: Reconcile current head and classify transient failure
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/retry_dependency_ci.py

  health:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check scheduled dependency discovery freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_MODE: health
        run: python3 scripts/retry_dependency_ci.py
