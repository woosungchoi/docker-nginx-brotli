name: auto-merge dependency PR

on:
  workflow_run:
    workflows: [smoke-test, ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Only trusted default-branch code runs with the merge token.
      - name: Check out trusted policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: master
          persist-credentials: false
      - name: Evaluate exact-head dependency policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER="$WORKFLOW_PR"
          fi
          if [ -z "${PR_NUMBER:-}" ] && [ "$WORKFLOW_HEAD_BRANCH" = ci/update-pinned-versions ]; then
            PR_NUMBER=$(gh pr list --repo "$REPO" --state open --head ci/update-pinned-versions --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            echo 'No dependency pull request to evaluate.'
            exit 0
          fi
          python3 -m scripts.dependency_policy --repo "$REPO" --pr "$PR_NUMBER"
