name: update pinned dependency versions

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DEPENDENCY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: docker-nginx-brotli
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve latest upstream versions
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/update_versions.py

      - name: Create pull request if Dockerfile changed
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: update nginx, pcre2, and zlib versions'
          title: 'chore: update nginx, pcre2, and zlib versions'
          body: |
            Automated version, archive checksum, official Alpine digest and module commit refresh.
            Only the trusted dependency merge workflow may merge after all current-head checks.

            This workflow:
            - tracks the latest nginx stable release from nginx.org/download/
            - tracks the latest stable PCRE2 release from GitHub
            - tracks the latest stable zlib release from GitHub

            Please review the updated pins and let CI/build validation run before merging.
          branch: ci/update-pinned-versions
          delete-branch: true
          labels: |
            dependencies
            automated pr
