name: smoke-test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: runtime smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v6
            runner: ubuntu-latest
          - platform: linux/arm/v7
            runner: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked HTTP3 test dependencies
        run: python3 -m pip install --require-hashes -r tests/requirements.txt
      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v6' || matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build final image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: nginx-http3:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=smoke-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.platform }}
      - name: Test final runtime and recommended configuration
        env:
          IMAGE: nginx-http3:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/runtime_smoke.py "$IMAGE" --platform "$PLATFORM"

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: runtime-smoke
    if: ${{ always() }}
    steps:
      - name: Require every architecture to pass
        env:
          RESULT: ${{ needs.runtime-smoke.result }}
        run: test "$RESULT" = success
